<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forever Wrapped</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&family=Circular+Std:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1DB954; --black: #0a0a0a; --surface: #111111; --surface2: #1a1a1a; --surface3: #222222;
      --border: rgba(255,255,255,0.07); --text: #ffffff; --text-muted: #a0a0a0; --text-dim: #555555;
      --accent1: #FF6B6B; --accent2: #FFD93D; --accent3: #6BCB77; --accent4: #4D96FF;
      --radius: 16px; --font-display: 'Montserrat', sans-serif; --font-mono: 'Space Mono', monospace;
    }
    body { background: var(--black); color: var(--text); font-family: var(--font-display); min-height: 100vh; overflow-x: hidden; }
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.12; animation: drift 20s ease-in-out infinite; }
    .orb1 { width: 600px; height: 600px; background: var(--green); top: -200px; left: -100px; }
    .orb2 { width: 500px; height: 500px; background: var(--accent4); bottom: -200px; right: -100px; animation-delay: -7s; }
    .orb3 { width: 300px; height: 300px; background: var(--accent1); top: 40%; left: 50%; animation-delay: -14s; }
    @keyframes drift { 0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(40px,-30px) scale(1.05);}66%{transform:translate(-20px,40px) scale(0.95);} }
    #app { position: relative; z-index: 1; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);} }
    @keyframes cardSlideIn { from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);} }
    @keyframes barBounce { 0%,100%{transform:scaleY(0.5);opacity:0.4;}50%{transform:scaleY(1);opacity:1;} }
    @keyframes pulseGlow { 0%,100%{box-shadow:0 0 60px rgba(29,185,84,0.4);}50%{box-shadow:0 0 100px rgba(29,185,84,0.7);} }
    @keyframes toastIn { 0%{opacity:0;transform:translateX(-50%) translateY(20px);}15%,75%{opacity:1;transform:translateX(-50%) translateY(0);}100%{opacity:0;transform:translateX(-50%) translateY(-10px);} }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);} }
    @keyframes popIn { 0%{opacity:0;transform:scale(0.8);}100%{opacity:1;transform:scale(1);} }
    @keyframes wiggle { 0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2deg);} }

    /* ── LOGIN ── */
    .login-screen { min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;animation:fadeIn 0.8s ease both; }
    .logo-mark { width:80px;height:80px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;animation:pulseGlow 3s ease-in-out infinite; }
    .logo-mark svg { width:44px;height:44px;fill:var(--black); }
    .login-title { font-size:clamp(42px,8vw,80px);font-weight:900;letter-spacing:-3px;line-height:1;margin-bottom:12px; }
    .login-title span { color:var(--green); }
    .login-subtitle { font-size:16px;color:var(--text-muted);font-weight:300;margin-bottom:48px;max-width:420px; }
    .btn-login { display:inline-flex;align-items:center;gap:12px;background:var(--green);color:var(--black);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;padding:18px 40px;border-radius:100px;border:none;cursor:pointer;transition:all 0.2s ease;box-shadow:0 8px 40px rgba(29,185,84,0.35); }
    .btn-login:hover { transform:scale(1.04) translateY(-2px);box-shadow:0 12px 50px rgba(29,185,84,0.5);background:#1ed760; }
    .login-features { display:flex;gap:24px;margin-top:60px;flex-wrap:wrap;justify-content:center; }
    .feature-pill { display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);padding:10px 18px;border-radius:100px;font-size:13px;color:var(--text-muted); }
    .feature-pill .dot { width:6px;height:6px;border-radius:50%;background:var(--green); }

    /* ── YEAR STORY EXPERIENCE ── */
    .story-section { position: relative; }
    .year-tabs { display:flex;gap:8px;padding:24px 24px 0;max-width:1200px;margin:0 auto;flex-wrap:wrap; }
    .year-tab { background:var(--surface2);border:2px solid var(--border);color:var(--text-muted);font-family:var(--font-display);font-size:13px;font-weight:700;padding:8px 20px;border-radius:100px;cursor:pointer;transition:all 0.2s; }
    .year-tab.active { color:var(--black);border-color:transparent; }
    .year-tab[data-year="2024"].active { background:#FF6B35; }
    .year-tab[data-year="2023"].active { background:#FF2D55; }
    .year-tab[data-year="2022"].active { background:#8B5CF6; }
    .year-tab[data-year="2021"].active { background:#1DB954; }

    /* Story viewer */
    .story-viewer {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 24px auto 0;
      border-radius: 28px;
      overflow: hidden;
      aspect-ratio: 9/16;
      cursor: pointer;
      user-select: none;
    }
    .story-progress { display:flex;gap:4px;position:absolute;top:16px;left:16px;right:16px;z-index:10; }
    .story-progress-bar { flex:1;height:3px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden; }
    .story-progress-fill { height:100%;background:#fff;border-radius:2px;transition:width 0.1s linear; }
    .story-nav { position:absolute;inset:0;display:flex;z-index:9; }
    .story-nav-left { flex:1; }
    .story-nav-right { flex:1; }

    /* Slide base */
    .story-slide { position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px 40px;text-align:center;transition:opacity 0.3s;opacity:0;pointer-events:none; }
    .story-slide.active { opacity:1;pointer-events:auto; }
    .slide-logo { position:absolute;top:32px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:3px;opacity:0.8; }

    /* 2024 Style — sleek gradient, bold white type */
    .slide-2024-intro { background:linear-gradient(160deg,#0a0a0a 0%,#1a1a2e 50%,#16213e 100%); }
    .slide-2024-intro .big-number { font-size:clamp(80px,20vw,160px);font-weight:900;letter-spacing:-8px;line-height:0.85;background:linear-gradient(135deg,#FF6B35,#FFD93D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .slide-2024-tracks { background:linear-gradient(160deg,#0d0d0d,#1a0a2e); }
    .slide-2024-artists { background:linear-gradient(160deg,#0a1a0a,#0d2b1a); }
    .slide-2024-genre { background:linear-gradient(160deg,#1a0a0a,#2b1a0d); }
    .slide-2024-minutes { background:linear-gradient(160deg,#0a0a1a,#1a0a2e); }
    .slide-2024-end { background:linear-gradient(160deg,#0a0a0a,#1DB954 200%); }

    /* 2023 Style — fiery red/rose/mint chaos */
    .slide-2023-intro { background:#FF2D55; }
    .slide-2023-tracks { background:#000000;border:none; }
    .slide-2023-artists { background:#00C4A7; }
    .slide-2023-genre { background:#FF2D55; }
    .slide-2023-minutes { background:#000000; }
    .slide-2023-end { background:#FF9500; }
    .squiggle { position:absolute;opacity:0.15;pointer-events:none; }

    /* 2022 Style — monogram shapes, vibrant gradients */
    .slide-2022-intro { background:linear-gradient(135deg,#7C3AED,#EC4899); }
    .slide-2022-tracks { background:linear-gradient(135deg,#059669,#0891B2); }
    .slide-2022-artists { background:linear-gradient(135deg,#DC2626,#7C3AED); }
    .slide-2022-genre { background:linear-gradient(135deg,#D97706,#DC2626); }
    .slide-2022-minutes { background:linear-gradient(135deg,#0891B2,#7C3AED); }
    .slide-2022-end { background:linear-gradient(135deg,#059669,#7C3AED); }

    /* 2021 Style — bold black/white/green minimal */
    .slide-2021-intro { background:#000000; }
    .slide-2021-tracks { background:#121212; }
    .slide-2021-artists { background:#000000; }
    .slide-2021-genre { background:#1DB954; }
    .slide-2021-minutes { background:#121212; }
    .slide-2021-end { background:#000000; }

    /* Slide content components */
    .slide-year-badge { font-size:11px;font-weight:700;letter-spacing:3px;opacity:0.6;margin-bottom:16px;text-transform:uppercase; }
    .slide-headline { font-size:clamp(14px,3.5vw,18px);font-weight:300;line-height:1.5;margin-bottom:8px;opacity:0.8; }
    .slide-big { font-size:clamp(36px,9vw,56px);font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:12px; }
    .slide-sub { font-size:clamp(13px,3vw,15px);font-weight:300;opacity:0.7;line-height:1.4; }
    .slide-number { font-size:clamp(64px,18vw,120px);font-weight:900;letter-spacing:-6px;line-height:0.9;margin-bottom:8px; }
    .slide-track-list { width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:8px; }
    .slide-track-item { display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.1);border-radius:12px;padding:10px 12px; }
    .slide-track-num { font-family:var(--font-mono);font-size:12px;font-weight:700;opacity:0.5;min-width:20px; }
    .slide-track-img { width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.1); }
    .slide-track-info { flex:1;min-width:0; }
    .slide-track-name { font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .slide-track-artist { font-size:11px;opacity:0.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .slide-artist-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;margin-top:8px; }
    .slide-artist-item { display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,0.1);border-radius:14px;padding:14px 10px; }
    .slide-artist-img { width:56px;height:56px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,0.1); }
    .slide-artist-name { font-size:12px;font-weight:700;text-align:center;line-height:1.2; }
    .slide-artist-num { font-size:10px;opacity:0.5;font-family:var(--font-mono); }
    .slide-genre-pill { display:inline-block;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4);font-size:clamp(18px,5vw,28px);font-weight:900;padding:12px 28px;border-radius:100px;margin-bottom:16px;letter-spacing:-0.5px; }
    .slide-swipe-hint { position:absolute;bottom:20px;font-size:11px;opacity:0.4;letter-spacing:1px; }
    .slide-img-big { width:140px;height:140px;border-radius:20px;object-fit:cover;margin-bottom:16px;box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    .slide-img-big.circle { border-radius:50%; }
    .monogram { position:absolute;font-size:200px;font-weight:900;opacity:0.06;letter-spacing:-20px;pointer-events:none;line-height:1; }

    /* Scroll divider */
    .scroll-divider { max-width:1200px;margin:48px auto 0;padding:0 24px;display:flex;align-items:center;gap:16px; }
    .scroll-divider-line { flex:1;height:1px;background:var(--border); }
    .scroll-divider-text { font-size:12px;font-weight:700;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;white-space:nowrap; }
    .scroll-arrow { text-align:center;padding:8px 0 32px;font-size:24px;animation:bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0);}50%{transform:translateY(6px);} }

    /* ── DASHBOARD ── */
    .dashboard { max-width:1200px;margin:0 auto;padding:40px 24px 100px;animation:fadeIn 0.6s ease both; }
    .dash-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:48px;flex-wrap:wrap;gap:16px; }
    .dash-brand { display:flex;align-items:center;gap:12px; }
    .dash-brand-dot { width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green); }
    .dash-brand-name { font-size:18px;font-weight:900; }
    .dash-brand-name span { color:var(--green); }
    .user-pill { display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);padding:8px 16px 8px 8px;border-radius:100px; }
    .user-avatar { width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface3); }
    .user-name { font-size:13px;font-weight:600; }
    .btn-logout { background:none;border:1px solid var(--border);color:var(--text-muted);font-family:var(--font-display);font-size:12px;padding:8px 16px;border-radius:100px;cursor:pointer;transition:all 0.2s; }
    .btn-logout:hover { border-color:var(--accent1);color:var(--accent1); }
    .time-selector { display:flex;gap:8px;margin-bottom:40px;flex-wrap:wrap; }
    .time-btn { background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-family:var(--font-display);font-size:13px;font-weight:600;padding:10px 20px;border-radius:100px;cursor:pointer;transition:all 0.2s; }
    .time-btn:hover { border-color:var(--green);color:var(--text); }
    .time-btn.active { background:var(--green);border-color:var(--green);color:var(--black); }
    .hero-section { display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:32px; }
    @media(max-width:768px){.hero-section{grid-template-columns:1fr;}}
    .hero-card { background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px;position:relative;overflow:hidden;animation:cardSlideIn 0.5s ease both; }
    .hero-card::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent-color,var(--green)),transparent); }
    .hero-card:nth-child(1){--accent-color:var(--green);animation-delay:0.1s;}
    .hero-card:nth-child(2){--accent-color:var(--accent4);animation-delay:0.15s;}
    .hero-card:nth-child(3){--accent-color:var(--accent2);animation-delay:0.2s;}
    .hero-label { font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:16px; }
    .hero-img { width:72px;height:72px;border-radius:12px;object-fit:cover;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,0.4); }
    .hero-img.circle { border-radius:50%; }
    .hero-value { font-size:22px;font-weight:700;line-height:1.2;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .hero-meta { font-size:13px;color:var(--text-muted); }
    .section-title { font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:20px;display:flex;align-items:center;gap:10px; }
    .section-title::after { content:'';flex:1;height:1px;background:var(--border); }
    .section-wrap { margin-bottom:48px; }
    .track-list { display:flex;flex-direction:column;gap:8px; }
    .track-card { display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all 0.25s ease;position:relative;overflow:hidden; }
    .track-card:hover { border-color:rgba(29,185,84,0.3);transform:translateX(4px); }
    .track-card .badge { position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent2);font-family:var(--font-mono); }
    .track-rank { font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--text-dim);min-width:28px;flex-shrink:0; }
    .track-art { width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0; }
    .track-info { flex:1;min-width:0; }
    .track-name { font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .track-artist { font-size:13px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .track-meta { font-size:11px;color:var(--text-dim);margin-top:2px; }
    .track-bar-wrap { width:60px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;flex-shrink:0; }
    .track-bar { height:100%;background:var(--green);border-radius:2px; }
    .artists-grid { display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start; }
    @media(max-width:900px){.artists-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:500px){.artists-grid{grid-template-columns:repeat(2,1fr);}}
    .artist-card { background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px 16px;text-align:center;cursor:pointer;transition:all 0.3s ease;position:relative;align-self:start; }
    .artist-card:hover { border-color:rgba(29,185,84,0.4);transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,0.4); }
    .artist-rank-badge { position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.7);border:1px solid var(--border);font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--green);padding:3px 7px;border-radius:6px; }
    .artist-img { width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 12px;border:2px solid var(--border);display:block;transition:border-color 0.3s; }
    .artist-card:hover .artist-img { border-color:var(--green); }
    .artist-name { font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .artist-sub { font-size:11px;color:var(--text-muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .albums-flex { display:flex;flex-wrap:wrap;gap:12px; }
    .album-card { background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;cursor:pointer;transition:all 0.3s ease;width:calc(20% - 10px);flex-shrink:0;flex-grow:0; }
    @media(max-width:900px){.album-card{width:calc(33.333% - 8px);}}
    @media(max-width:500px){.album-card{width:calc(50% - 6px);}}
    .album-card:hover { border-color:rgba(29,185,84,0.4);transform:translateY(-4px);box-shadow:0 16px 32px rgba(0,0,0,0.4); }
    .album-img { width:100%;display:block;border-radius:8px;aspect-ratio:1/1;object-fit:cover;margin-bottom:10px; }
    .album-name { font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px; }
    .album-artist { font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .album-year { font-size:11px;color:var(--text-dim);margin-top:2px;font-family:var(--font-mono); }
    .btn-more { display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-family:var(--font-display);font-size:13px;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;transition:all 0.2s; }
    .btn-more:hover { border-color:var(--green);color:var(--green); }
    .vibe-banner { background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:24px;padding:36px 40px;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:48px;flex-wrap:wrap;gap:24px;position:relative;overflow:hidden; }
    .vibe-banner::before { content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(29,185,84,0.15) 0%,transparent 70%);border-radius:50%; }
    .vibe-left { flex:1;min-width:200px;position:relative;z-index:1; }
    .vibe-eyebrow { font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:8px; }
    .vibe-value { font-size:clamp(28px,5vw,52px);font-weight:900;letter-spacing:-2px;line-height:1; }
    .vibe-desc { font-size:14px;color:var(--text-muted);margin-top:8px; }
    .genre-tags { display:flex;gap:8px;flex-wrap:wrap;margin-top:12px; }
    .genre-tag { background:rgba(29,185,84,0.12);border:1px solid rgba(29,185,84,0.25);color:var(--green);font-size:12px;font-weight:600;padding:6px 14px;border-radius:100px; }
    .decade-bars { display:flex;flex-direction:column;gap:10px;min-width:180px;position:relative;z-index:1; }
    .decade-row { display:flex;align-items:center;gap:12px; }
    .decade-label { font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text-muted);min-width:40px; }
    .decade-bar-wrap { flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden; }
    .decade-bar { height:100%;background:var(--green);border-radius:3px; }
    .decade-count { font-family:var(--font-mono);font-size:11px;color:var(--text-dim);min-width:20px;text-align:right; }
    .stats-row { display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:48px; }
    @media(max-width:600px){.stats-row{grid-template-columns:1fr;}}
    .stat-block { background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px; }
    .stat-icon { font-size:28px;margin-bottom:12px;display:block; }

function inferGenres(artists) {
  const g={};
  artists.forEach(a=>{
    const name=a.name.toLowerCase();
    if(ARTIST_GENRE_MAP[name]){ARTIST_GENRE_MAP[name].forEach(x=>{g[x]=(g[x]||0)+2;});return;}
    for(const [key,genres] of Object.entries(ARTIST_GENRE_MAP)){
      if(name.includes(key)||key.includes(name)){genres.forEach(x=>{g[x]=(g[x]||0)+1;});break;}
    }
  });
  return Object.entries(g).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}

function generateCodeVerifier(l=128){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';let r='';crypto.getRandomValues(new Uint8Array(l)).forEach(v=>{r+=c[v%c.length];});return r;}
async function generateCodeChallenge(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
async function initiateLogin(){const v=generateCodeVerifier();localStorage.setItem('pkce_verifier',v);const p=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,code_challenge_method:'S256',code_challenge:await generateCodeChallenge(v),scope:SCOPES,show_dialog:'true'});window.location.href=`https://accounts.spotify.com/authorize?${p}`;}
async function exchangeToken(code){const v=localStorage.getItem('pkce_verifier');if(!v)throw new Error('No PKCE verifier');const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:v})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.error||'Token failed');localStorage.removeItem('pkce_verifier');return d;}

async function fetchAllData(token,timeRange){
  setDebug('Fetching '+timeRange+'...');
  const h={Authorization:`Bearer ${token}`};
  const get=async(url)=>{try{const r=await fetch(url,{headers:h});if(!r.ok)return null;return await r.json();}catch(e){return null;}};
  const [tracksData,artistsData,profileData,recentData]=await Promise.all([
    get(`https://api.spotify.com/v1/me/top/tracks?limit=50&time_range=${timeRange}`),
    get(`https://api.spotify.com/v1/me/top/artists?limit=50&time_range=${timeRange}`),
    get('https://api.spotify.com/v1/me'),
    get('https://api.spotify.com/v1/me/player/recently-played?limit=50'),
  ]);
  const tracks=tracksData?.items||[];
  const artists=artistsData?.items||[];
  const recentTracks=(recentData?.items||[]).map(i=>({...i.track,played_at:i.played_at}));
  const spotifyGenreMap={};
  artists.forEach(a=>(a.genres||[]).forEach(g=>{spotifyGenreMap[g]=(spotifyGenreMap[g]||0)+1;}));
  const spotifyGenres=Object.entries(spotifyGenreMap).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  const genres=spotifyGenres.length>0?spotifyGenres:inferGenres(artists);
  const albumMap={};
  tracks.forEach(t=>{const a=t.album;if(!a?.id)return;if(!albumMap[a.id])albumMap[a.id]={...a,trackCount:0};albumMap[a.id].trackCount++;});
  const albums=Object.values(albumMap).sort((a,b)=>b.trackCount-a.trackCount);
  const estMinutes=Math.round(tracks.reduce((sum,t)=>(sum+(t.duration_ms||180000)),0)/60000)*8;
  setDebug(`${tracks.length} tracks · ${artists.length} artists · ${genres.length} genres`);
  return{tracks,artists,albums,recentTracks,genres,profile:profileData||{},estMinutes};
}

function getTopDecade(tracks){const d={};tracks.forEach(t=>{const y=parseInt((t.album?.release_date||'2000').slice(0,4));const dec=Math.floor(y/10)*10;d[dec]=(d[dec]||0)+1;});const s=Object.entries(d).sort((a,b)=>b[1]-a[1]);return s.length>0?s[0][0]+'s':null;}
function getDecadeBreakdown(tracks){const d={};tracks.forEach(t=>{const y=parseInt((t.album?.release_date||'2000').slice(0,4));const dec=Math.floor(y/10)*10;d[dec]=(d[dec]||0)+1;});const s=Object.entries(d).sort((a,b)=>b[1]-a[1]).slice(0,4);const max=s[0]?.[1]||1;return s.map(([dec,c])=>({decade:dec+'s',count:c,pct:Math.round((c/max)*100)}));}
function timeAgo(ds){const diff=Date.now()-new Date(ds).getTime(),m=Math.floor(diff/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}

function StoryViewer({ data }) {
  const years = [2024, 2023, 2022, 2021];
  const [activeYear, setActiveYear] = useState(2024);
  const [slideIndex, setSlideIndex] = useState(0);
  const [progress, setProgress] = useState(0);
  const timerRef = useRef(null);
  const SLIDE_DURATION = 5000;

  const slides = buildSlides(activeYear, data);
  const total = slides.length;

  const goNext = () => setSlideIndex(i => Math.min(i+1, total-1));
  const goPrev = () => setSlideIndex(i => Math.max(i-1, 0));

  useEffect(() => {
    setProgress(0);
    clearInterval(timerRef.current);
    const start = Date.now();
    timerRef.current = setInterval(() => {
      const elapsed = Date.now() - start;
      const pct = Math.min((elapsed / SLIDE_DURATION) * 100, 100);
      setProgress(pct);
      if (pct >= 100) {
        clearInterval(timerRef.current);
        setSlideIndex(i => {
          if (i < total - 1) return i + 1;
          return i;
        });
      }
    }, 50);
    return () => clearInterval(timerRef.current);
  }, [slideIndex, activeYear]);

  const handleYearChange = (year) => {
    setActiveYear(year);
    setSlideIndex(0);
    setProgress(0);
  };

  return (
    <div className="story-section">
      <div className="year-tabs">
        {years.map(y => (
          <button key={y} data-year={y} className={`year-tab ${activeYear===y?'active':''}`} onClick={()=>handleYearChange(y)}>
            {y} Wrapped
          </button>
        ))}
      </div>

      <div className="story-viewer" onClick={e => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width / 2) goPrev(); else goNext();
      }}>
        {/* Progress bars */}
        <div className="story-progress">
          {slides.map((_,i) => (
            <div className="story-progress-bar" key={i}>
              <div className="story-progress-fill" style={{
                width: i < slideIndex ? '100%' : i === slideIndex ? `${progress}%` : '0%'
              }}/>
            </div>
          ))}
        </div>

        {/* Slides */}
        {slides.map((slide, i) => (
          <div key={i} className={`story-slide ${slide.cls} ${i===slideIndex?'active':''}`}>
            <div className="slide-logo">FOREVER WRAPPED</div>
            {slide.content}
            <div className="slide-swipe-hint">TAP TO ADVANCE</div>
          </div>
        ))}
      </div>

      <div style={{textAlign:'center',marginTop:12,fontSize:12,color:'var(--text-dim)'}}>
        {slideIndex+1} / {total} — tap left/right sides to navigate
      </div>
    </div>
  );
}

// ── DASHBOARD COMPONENTS ──
function TimeSelector({value,onChange}){return(<div className="time-selector">{[['short_term','Last 4 Weeks'],['medium_term','Last 6 Months'],['long_term','All Time']].map(([v,l])=>(<button key={v} className={`time-btn ${value===v?'active':''}`} onClick={()=>onChange(v)}>{l}</button>))}</div>);}
function TrackRow({track,index,showTime}){return(<div className="track-card" onClick={()=>window.open(track.external_urls?.spotify,'_blank')}><span className={`track-rank ${rankClass(index)}`}>#{index+1}</span><img className="track-art" src={track.album?.images?.[0]?.url||''} alt={track.name} onError={e=>{e.target.src='https://via.placeholder.com/52/222/555?text=♪';}}/><div className="track-info"><div className="track-name">{track.name}</div><div className="track-artist">{(track.artists||[]).map(a=>a.name).join(', ')}</div>{showTime&&track.played_at&&<div className="track-meta">{timeAgo(track.played_at)}</div>}</div>{!showTime&&<div className="track-bar-wrap"><div className="track-bar" style={{width:`${track.popularity||60}%`}}/></div>}{showTime&&<span className="badge">RECENT</span>}</div>);}
function ArtistCard({artist,index}){return(<div className="artist-card" onClick={()=>window.open(artist.external_urls?.spotify,'_blank')}><span className="artist-rank-badge">#{index+1}</span><img className="artist-img" src={artist.images?.[0]?.url||''} alt={artist.name} onError={e=>{e.target.src='https://via.placeholder.com/80/222/555?text=♪';}}/><div className="artist-name">{artist.name}</div><div className="artist-sub">{(artist.genres||[])[0]||'Artist'}</div></div>);}
function AlbumCard({album}){const year=(album.release_date||'').slice(0,4);return(<div className="album-card" onClick={()=>window.open(album.external_urls?.spotify,'_blank')}><img className="album-img" src={album.images?.[0]?.url||''} alt={album.name} onError={e=>{e.target.src='https://via.placeholder.com/200/222/555?text=♪';}}/><div className="album-name">{album.name}</div><div className="album-artist">{(album.artists||[]).map(a=>a.name).join(', ')}</div>{year&&<div className="album-year">{year}</div>}</div>);}
function ShowMoreSection({title,items,renderItem,initialCount=5,step=5,containerClass}){const [visible,setVisible]=useState(initialCount);useEffect(()=>{setVisible(initialCount);},[items,initialCount]);const shown=items.slice(0,visible);const remaining=items.length-visible;return(<div className="section-wrap"><div className="section-title">{title}</div><div className={containerClass||'track-list'}>{shown.map((item,i)=>renderItem(item,i))}</div>{remaining>0&&<button className="btn-more" onClick={()=>setVisible(v=>Math.min(v+step,items.length))}>+ Show {Math.min(step,remaining)} more</button>}</div>);}
function VibeBanner({tracks,genres}){const topDecade=getTopDecade(tracks);const breakdown=getDecadeBreakdown(tracks);const topGenres=genres.slice(0,6);return(<div className="vibe-banner"><div className="vibe-left"><div className="vibe-eyebrow">Your Music Era</div><div className="vibe-value">{topDecade||'Mixed'}</div><div className="vibe-desc">Based on your top track release years</div>{topGenres.length>0?(<><div className="vibe-eyebrow" style={{marginTop:16}}>Top Genres</div><div className="genre-tags">{topGenres.map(g=><span className="genre-tag" key={g}>{g}</span>)}</div></>):(<div className="vibe-desc" style={{marginTop:10,fontStyle:'italic',opacity:0.6}}>Genre data unavailable</div>)}</div>{breakdown.length>0&&(<div className="decade-bars">{breakdown.map(({decade,count,pct})=>(<div className="decade-row" key={decade}><span className="decade-label">{decade}</span><div className="decade-bar-wrap"><div className="decade-bar" style={{width:pct+'%'}}/></div><span className="decade-count">{count}</span></div>))}</div>)}</div>);}

function MainApp({ token, onLogout }) {
  const [timeRange, setTimeRange] = useState('medium_term');
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [showCopied, setShowCopied] = useState(false);

  const load = useCallback(async () => {
    setLoading(true); setError(null); setData(null);
    try { setData(await fetchAllData(token, timeRange)); }
    catch(e) { if(e.message==='TOKEN_EXPIRED') onLogout(); else setError(e.message); }
    finally { setLoading(false); }
  }, [token, timeRange]);

  useEffect(() => { load(); }, [load]);
  if (loading) return <LoadingScreen message="Fetching your music data…"/>;

  const tracks=data?.tracks||[], artists=data?.artists||[], albums=data?.albums||[];
  const recent=data?.recentTracks||[], genres=data?.genres||[], profile=data?.profile||{};
  const hasData=tracks.length>0||artists.length>0;
  const topDecade=getTopDecade(tracks);

  const handleShare=()=>{const text=`🎵 My Forever Wrapped:\n#1 Track: ${tracks[0]?.name||'?'}\n#1 Artist: ${artists[0]?.name||'?'}\nTop Genre: ${genres[0]||'N/A'}\nTop Era: ${topDecade||'Mixed'}\n\nforever-wrapped.onrender.com`;navigator.clipboard.writeText(text).then(()=>{setShowCopied(true);setTimeout(()=>setShowCopied(false),2600);});};
  const tweetShare=()=>{const text=encodeURIComponent(`🎵 My #ForeverWrapped: Top Artist is ${artists[0]?.name||'?'} — ${genres[0]||'good music'} in the ${topDecade||'past'} 🎶`);window.open(`https://twitter.com/intent/tweet?text=${text}`,'_blank');};

  return (
    <div>
      {/* HEADER */}
      <div style={{maxWidth:1200,margin:'0 auto',padding:'24px 24px 0',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div className="dash-brand"><div className="dash-brand-dot"/><div className="dash-brand-name">Forever<span>Wrapped</span></div></div>
        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          {profile.display_name&&(<div className="user-pill"><img className="user-avatar" src={profile.images?.[0]?.url||''} alt={profile.display_name} onError={e=>{e.target.style.display='none';}}/><span className="user-name">{profile.display_name}</span></div>)}
          <button className="btn-logout" onClick={onLogout}>Sign out</button>
        </div>
      </div>

      {error&&<div style={{maxWidth:1200,margin:'16px auto',padding:'0 24px'}}><div className="error-card">⚠️ {error} <button onClick={load} style={{background:'none',border:'none',color:'inherit',cursor:'pointer',textDecoration:'underline',marginLeft:8}}>Retry</button></div></div>}

      {!error && !hasData && (
        <div className="empty-state"><div className="emoji">🎵</div><h2>Not enough listening history</h2><p>Try <strong>All Time</strong> or listen to more music!</p></div>
      )}

      {!error && hasData && (
        <>
          {/* STORY EXPERIENCE */}
          <StoryViewer data={data}/>

          {/* DIVIDER */}
          <div className="scroll-divider">
            <div className="scroll-divider-line"/>
            <div className="scroll-divider-text">Your full stats below</div>
            <div className="scroll-divider-line"/>
          </div>
          <div className="scroll-arrow">↓</div>

          {/* FULL DASHBOARD */}
          <div className="dashboard" style={{paddingTop:0}}>
            <TimeSelector value={timeRange} onChange={setTimeRange}/>

            <div className="hero-section">
              <div className="hero-card">
                <div className="hero-label">🎵 Top Track</div>
                {tracks[0]&&<><img className="hero-img" src={tracks[0].album?.images?.[0]?.url||''} alt={tracks[0].name} onError={e=>{e.target.src='https://via.placeholder.com/72/222/555?text=♪';}}/><div className="hero-value">{tracks[0].name}</div><div className="hero-meta">{(tracks[0].artists||[]).map(a=>a.name).join(', ')}</div></>}
              </div>
              <div className="hero-card">
                <div className="hero-label">🎤 Top Artist</div>
                {artists[0]&&<><img className="hero-img circle" src={artists[0].images?.[0]?.url||''} alt={artists[0].name} onError={e=>{e.target.src='https://via.placeholder.com/72/222/555?text=♪';}}/><div className="hero-value">{artists[0].name}</div><div className="hero-meta">{genres[0]||'Artist'}</div></>}
              </div>
              <div className="hero-card">
                <div className="hero-label">💿 Top Album</div>
                {albums[0]&&<><img className="hero-img" src={albums[0].images?.[0]?.url||''} alt={albums[0].name} onError={e=>{e.target.src='https://via.placeholder.com/72/222/555?text=♪';}}/><div className="hero-value">{albums[0].name}</div><div className="hero-meta">{(albums[0].artists||[]).map(a=>a.name).join(', ')}</div></>}
              </div>
            </div>

            <div className="stats-row">
              <div className="stat-block"><span className="stat-icon">🎵</span><div className="stat-number">{tracks.length}</div><div className="stat-label">Top tracks</div></div>
              <div className="stat-block"><span className="stat-icon">🎤</span><div className="stat-number">{artists.length}</div><div className="stat-label">Top artists</div></div>
              <div className="stat-block"><span className="stat-icon">⏱</span><div className="stat-number">{fmtMinutes(data.estMinutes)}</div><div className="stat-label">Est. minutes</div></div>
            </div>

            <VibeBanner tracks={tracks} genres={genres}/>

            <ShowMoreSection title="Top Tracks" items={tracks} initialCount={5} step={5} containerClass="track-list"
              renderItem={(t,i)=><TrackRow key={t.id} track={t} index={i} showTime={false}/>}/>
            <ShowMoreSection title="Top Artists" items={artists} initialCount={5} step={5} containerClass="artists-grid"
              renderItem={(a,i)=><ArtistCard key={a.id} artist={a} index={i}/>}/>
            <ShowMoreSection title="Top Albums" items={albums} initialCount={5} step={5} containerClass="albums-flex"
              renderItem={(a,i)=><AlbumCard key={a.id} album={a} index={i}/>}/>
            {recent.length>0&&(
              <ShowMoreSection title="Recently Played" items={recent} initialCount={5} step={5} containerClass="track-list"
                renderItem={(t,i)=><TrackRow key={t.id+'-'+i} track={t} index={i} showTime={true}/>}/>
            )}

            <div className="share-section">
              <div className="share-text"><h3>Share your Wrapped</h3><p>Let the world know what you've been listening to</p></div>
              <div className="share-buttons">
                <button className="btn-share twitter" onClick={tweetShare}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.741l7.73-8.835L1.254 2.25H8.08l4.264 5.633 5.9-5.633zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                  Tweet
                </button>
                <button className="btn-share copy" onClick={handleShare}>📋 Copy Stats</button>
              </div>
            </div>
          </div>
        </>
      )}
      {showCopied&&<div className="copied-toast">✓ Copied to clipboard!</div>}
    </div>
  );
}

function App(){
  const [token,setToken]=useState(()=>sessionStorage.getItem('spotify_token'));
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    const code=p.get('code'),err=p.get('error');
    setDebug(code?'Got callback...':err?'Error: '+err:'Ready');
    if(err){setError('Login cancelled: '+err);window.history.replaceState({},'','/');return;}
    if(code){
      window.history.replaceState({},'','/');setLoading(true);
      exchangeToken(code)
        .then(d=>{sessionStorage.setItem('spotify_token',d.access_token);setToken(d.access_token);})
        .catch(e=>{setDebug('Error: '+e.message);setError(e.message);})
        .finally(()=>setLoading(false));
    }
  },[]);
  return(
    <div id="app">
      <div className="bg-orbs"><div className="orb orb1"/><div className="orb orb2"/><div className="orb orb3"/></div>
      {loading&&<LoadingScreen message="Connecting to Spotify…"/>}
      {error&&!loading&&(<div className="login-screen"><div className="error-card" style={{maxWidth:440}}>⚠️ {error}</div><button className="btn-login" style={{marginTop:24}} onClick={()=>{setError(null);localStorage.clear();}}>Try Again</button></div>)}
      {!loading&&!error&&!token&&<LoginScreen/>}
      {!loading&&!error&&token&&<MainApp token={token} onLogout={()=>{sessionStorage.removeItem('spotify_token');setToken(null);}}/>}
      <div id="debug-bar" className="debug-bar">🎵 Ready</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
