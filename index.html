<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forever Wrapped</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,900;1,300;1,400;1,600;1,700;1,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1DB954; --black: #0a0a0a; --surface: #111111; --surface2: #1a1a1a; --surface3: #222222;
      --border: rgba(255,255,255,0.07); --text: #ffffff; --text-muted: #a0a0a0; --text-dim: #555555;
      --accent1: #FF6B6B; --accent2: #FFD93D; --accent3: #6BCB77; --accent4: #4D96FF;
      --w25-cream: #F0EDE4; --w25-black: #0D0D0D; --w25-yellow: #D4E84A; --w25-blue: #5B6BF5;
      --w25-red: #E8312A; --w25-green: #3CB043; --w25-purple: #8B7FE8;
      --radius: 16px; --font-display: 'Montserrat', sans-serif; --font-mono: 'Space Mono', monospace;
    }
    body { background: var(--black); color: var(--text); font-family: var(--font-display); min-height: 100vh; overflow-x: hidden; }
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.12; animation: drift 20s ease-in-out infinite; }
    .orb1 { width: 600px; height: 600px; background: var(--green); top: -200px; left: -100px; }
    .orb2 { width: 500px; height: 500px; background: var(--accent4); bottom: -200px; right: -100px; animation-delay: -7s; }
    .orb3 { width: 300px; height: 300px; background: var(--accent1); top: 40%; left: 50%; animation-delay: -14s; }
    @keyframes drift { 0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(40px,-30px) scale(1.05);}66%{transform:translate(-20px,40px) scale(0.95);} }
    #app { position: relative; z-index: 1; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);} }
    @keyframes cardSlideIn { from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);} }
    @keyframes barBounce { 0%,100%{transform:scaleY(0.5);opacity:0.4;}50%{transform:scaleY(1);opacity:1;} }
    @keyframes pulseGlow { 0%,100%{box-shadow:0 0 60px rgba(29,185,84,0.4);}50%{box-shadow:0 0 100px rgba(29,185,84,0.7);} }
    @keyframes toastIn { 0%{opacity:0;transform:translateX(-50%) translateY(20px);}15%,75%{opacity:1;transform:translateX(-50%) translateY(0);}100%{opacity:0;transform:translateX(-50%) translateY(-10px);} }
    @keyframes slideUp { from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);} }
    @keyframes popIn { 0%{opacity:0;transform:scale(0.85);}100%{opacity:1;transform:scale(1);} }

    /* LOGIN */
    .login-screen { min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;animation:fadeIn 0.8s ease both; }
    .logo-mark { width:80px;height:80px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;animation:pulseGlow 3s ease-in-out infinite; }
    .logo-mark svg { width:44px;height:44px;fill:var(--black); }
    .login-title { font-size:clamp(42px,8vw,80px);font-weight:900;letter-spacing:-3px;line-height:1;margin-bottom:12px; }
    .login-title span { color:var(--green); }
    .login-subtitle { font-size:16px;color:var(--text-muted);font-weight:300;margin-bottom:48px;max-width:420px; }
    .btn-login { display:inline-flex;align-items:center;gap:12px;background:var(--green);color:var(--black);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;padding:18px 40px;border-radius:100px;border:none;cursor:pointer;transition:all 0.2s ease;box-shadow:0 8px 40px rgba(29,185,84,0.35); }
    .btn-login:hover { transform:scale(1.04) translateY(-2px);box-shadow:0 12px 50px rgba(29,185,84,0.5);background:#1ed760; }
    .login-features { display:flex;gap:24px;margin-top:60px;flex-wrap:wrap;justify-content:center; }
    .feature-pill { display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);padding:10px 18px;border-radius:100px;font-size:13px;color:var(--text-muted); }
    .feature-pill .dot { width:6px;height:6px;border-radius:50%;background:var(--green); }

    /* YEAR TABS */
    .story-section { position:relative; }
    .year-tabs { display:flex;gap:8px;padding:24px 24px 0;max-width:1200px;margin:0 auto;flex-wrap:wrap; }
    .year-tab { background:var(--surface2);border:2px solid var(--border);color:var(--text-muted);font-family:var(--font-display);font-size:13px;font-weight:700;padding:8px 20px;border-radius:100px;cursor:pointer;transition:all 0.2s; }
    .year-tab.active { color:#000;border-color:transparent; }
    .year-tab[data-year="2025"].active { background:var(--w25-yellow); }
    .year-tab[data-year="2024"].active { background:#FF6B35;color:#fff; }
    .year-tab[data-year="2023"].active { background:#FF2D55;color:#fff; }
    .year-tab[data-year="2022"].active { background:#8B5CF6;color:#fff; }
    .year-tab[data-year="2021"].active { background:#1DB954;color:#000; }

    /* STORY VIEWER */
    .story-viewer { position:relative;width:100%;max-width:390px;margin:24px auto 0;border-radius:0;overflow:hidden;aspect-ratio:9/16;cursor:pointer;user-select:none; }
    .story-progress { display:flex;gap:4px;position:absolute;top:14px;left:14px;right:14px;z-index:10; }
    .story-progress-bar { flex:1;height:3px;background:rgba(0,0,0,0.2);border-radius:2px;overflow:hidden; }
    .story-progress-fill { height:100%;border-radius:2px;transition:width 0.1s linear; }
    .story-slide { position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;transition:opacity 0.25s;opacity:0;pointer-events:none;overflow:hidden; }
    .story-slide.active { opacity:1;pointer-events:auto; }

    /* ── 2025 SLIDE STYLES ── */

    /* Slide 1: INTRO — cream, "2025" vertical yellow left strip, checkerboard top */
    .s25-intro {
      background: var(--w25-cream);
      color: var(--w25-black);
      font-family: var(--font-display);
    }
    .s25-intro-strip {
      position:absolute; left:0; top:0; bottom:0; width:56px;
      background:var(--w25-black);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .s25-year-vertical {
      font-size:72px; font-weight:900; letter-spacing:-4px; line-height:1;
      writing-mode:vertical-rl; transform:rotate(180deg);
      color:var(--w25-yellow); font-style:italic;
    }
    .s25-intro-checker {
      position:absolute; top:0; left:56px; right:0; height:120px;
      background-image: repeating-conic-gradient(var(--w25-black) 0% 25%, var(--w25-cream) 0% 50%);
      background-size:24px 24px;
      opacity:0.9;
    }
    .s25-intro-body {
      position:absolute; top:0; left:56px; right:0; bottom:0;
      padding:130px 20px 24px;
      display:flex; flex-direction:column; justify-content:space-between;
    }
    .s25-intro-genres { display:flex;flex-direction:column;gap:2px; }
    .s25-genre-huge { font-size:52px;font-weight:900;line-height:0.95;letter-spacing:-2px;color:var(--w25-black); }
    .s25-genre-large { font-size:36px;font-weight:900;line-height:1;letter-spacing:-1px;color:var(--w25-black); }
    .s25-genre-med { font-size:26px;font-weight:700;line-height:1.1;color:var(--w25-black); }
    .s25-genre-small { font-size:18px;font-weight:600;line-height:1.2;color:var(--w25-black); }
    .s25-genre-tiny { font-size:13px;font-weight:600;line-height:1.3;color:var(--w25-black); }
    .s25-intro-bottom { display:flex;justify-content:space-between;align-items:flex-end; }
    .s25-intro-col { display:flex;flex-direction:column;gap:2px; }
    .s25-col-label { font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:2px; }
    .s25-col-item { font-size:10px;font-weight:600;color:var(--w25-black);line-height:1.4; }
    .s25-stat-big { font-size:22px;font-weight:900;color:var(--w25-black); }
    .s25-stat-label { font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888; }

    /* Slide 2: TOP GENRES — cream, italic title, stacked huge genres */
    .s25-genres {
      background:var(--w25-cream); color:var(--w25-black); padding:48px 28px 32px;
      display:flex; flex-direction:column; justify-content:space-between;
    }
    .s25-slide-title { font-size:14px;font-weight:700;font-style:italic;color:var(--w25-black);margin-bottom:20px;letter-spacing:0; }
    .s25-genres-list { display:flex;flex-direction:column;gap:4px;flex:1;justify-content:center; }
    .s25-genre-row { display:flex;align-items:baseline;gap:8px; }
    .s25-genre-num { font-size:11px;font-weight:700;color:#999;min-width:16px; }

    /* Slide 3: TOP ALBUMS — cream, 2x2 grid + list */
    .s25-albums {
      background:var(--w25-cream); color:var(--w25-black); padding:48px 24px 28px;
      display:flex; flex-direction:column;
    }
    .s25-albums-grid { display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:16px 0 12px; }
    .s25-album-square { aspect-ratio:1/1;background:#ccc;border-radius:4px;overflow:hidden; }
    .s25-album-square img { width:100%;height:100%;object-fit:cover;display:block; }
    .s25-albums-list { display:flex;flex-direction:column;gap:6px; }
    .s25-album-row { display:flex;align-items:center;gap:10px; }
    .s25-album-num { font-size:11px;font-weight:700;color:#999;min-width:14px; }
    .s25-album-info { display:flex;flex-direction:column; }
    .s25-album-name { font-size:12px;font-weight:700;color:var(--w25-black);line-height:1.2; }
    .s25-album-artist { font-size:10px;color:#666;font-weight:500; }

    /* Slide 4: TOP ARTISTS — black, arcs bg, list with photo chips */
    .s25-artists {
      background:var(--w25-black); color:var(--w25-cream); padding:48px 28px 32px;
      display:flex; flex-direction:column;
    }
    .s25-arcs {
      position:absolute; bottom:-20px; right:-40px; width:280px; height:280px;
      pointer-events:none;
    }
    .s25-artists-list { display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center; }
    .s25-artist-row { display:flex;align-items:center;gap:12px; }
    .s25-artist-num { font-size:11px;font-weight:700;color:#666;min-width:16px; }
    .s25-artist-chip { display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);border-radius:100px;padding:6px 14px 6px 6px; }
    .s25-artist-chip-img { width:36px;height:36px;border-radius:50%;object-fit:cover;background:#333;flex-shrink:0; }
    .s25-artist-chip-name { font-size:14px;font-weight:700;color:var(--w25-cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px; }
    .s25-artist-top-badge { font-size:9px;font-weight:700;letter-spacing:1px;color:var(--w25-yellow);text-transform:uppercase;margin-bottom:2px; }

    /* Slide 5: TOP ARTIST — black, big circle, arcs */
    .s25-top-artist {
      background:var(--w25-black); color:var(--w25-cream);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:48px 28px 40px; text-align:center;
    }
    .s25-big-circle { width:200px;height:200px;border-radius:50%;object-fit:cover;background:#222;margin-bottom:24px;position:relative;z-index:2; }
    .s25-arcs-center { position:absolute;width:100%;height:100%;pointer-events:none;top:0;left:0; }
    .s25-top-artist-label { font-size:13px;font-style:italic;font-weight:600;color:#888;margin-bottom:8px; }
    .s25-top-artist-name { font-size:clamp(28px,7vw,44px);font-weight:900;line-height:1;letter-spacing:-2px;color:var(--w25-cream); }
    .s25-top-artist-mins { font-size:12px;color:#666;margin-top:10px; }

    /* Slide 6: TOP SONGS — split: checker top, cream bottom */
    .s25-songs {
      background:var(--w25-cream); color:var(--w25-black);
      display:flex; flex-direction:column;
    }
    .s25-songs-checker { height:100px;flex-shrink:0;background-image:repeating-conic-gradient(var(--w25-black) 0% 25%,var(--w25-cream) 0% 50%);background-size:20px 20px; }
    .s25-songs-body { flex:1;padding:20px 28px 28px;display:flex;flex-direction:column; }
    .s25-songs-list { display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center; }
    .s25-song-row { display:flex;align-items:center;gap:12px; }
    .s25-song-num { font-size:11px;font-weight:700;color:#999;min-width:16px; }
    .s25-song-img { width:44px;height:44px;border-radius:4px;object-fit:cover;background:#ddd;flex-shrink:0; }
    .s25-song-info { flex:1;min-width:0; }
    .s25-song-name { font-size:13px;font-weight:700;color:var(--w25-black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .s25-song-artist { font-size:11px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }

    /* Slide 7: LISTENING AGE — cream, big purple number */
    .s25-age {
      background:var(--w25-cream); color:var(--w25-black); padding:48px 28px 40px;
      display:flex; flex-direction:column; justify-content:center;
    }
    .s25-big-purple { font-size:clamp(100px,28vw,160px);font-weight:900;line-height:0.85;letter-spacing:-8px;color:var(--w25-purple); }
    .s25-age-sub { font-size:15px;font-weight:500;color:#555;margin-top:16px;line-height:1.5; }
    .s25-age-era { font-weight:700;color:var(--w25-black); }

    /* Slide 8: MINUTES — black, big purple number */
    .s25-minutes {
      background:var(--w25-black); color:var(--w25-cream); padding:48px 28px 40px;
      display:flex; flex-direction:column; justify-content:center;
    }
    .s25-minutes-num { font-size:clamp(56px,16vw,96px);font-weight:900;line-height:0.9;letter-spacing:-4px;color:var(--w25-purple); }
    .s25-minutes-sub { font-size:14px;color:#888;margin-top:12px; }

    /* Slide 9: END — cream/black split */
    .s25-end {
      background:var(--w25-black); color:var(--w25-cream);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:40px 28px;
    }
    .s25-end-year { font-size:120px;font-weight:900;letter-spacing:-8px;line-height:0.85;font-style:italic;color:var(--w25-yellow); }
    .s25-end-sub { font-size:18px;font-weight:600;margin-top:20px;color:var(--w25-cream); }
    .s25-end-hint { font-size:12px;color:#555;margin-top:12px; }

    /* shared 2025 slide header */
    .s25-header { font-size:13px;font-weight:700;font-style:italic;margin-bottom:16px;color:inherit;opacity:0.7; }

    /* Other year slides (kept from before) */
    .slide-2024-intro{background:linear-gradient(160deg,#0a0a0a 0%,#1a1a2e 50%,#16213e 100%);}
    .slide-2024-tracks{background:linear-gradient(160deg,#0d0d0d,#1a0a2e);}
    .slide-2024-artists{background:linear-gradient(160deg,#0a1a0a,#0d2b1a);}
    .slide-2024-genre{background:linear-gradient(160deg,#1a0a0a,#2b1a0d);}
    .slide-2024-minutes{background:linear-gradient(160deg,#0a0a1a,#1a0a2e);}
    .slide-2024-end{background:linear-gradient(160deg,#0a0a0a,#1DB954 200%);}
    .slide-2023-intro{background:#FF2D55;}.slide-2023-tracks{background:#000000;}.slide-2023-artists{background:#00C4A7;}.slide-2023-genre{background:#FF2D55;}.slide-2023-minutes{background:#000000;}.slide-2023-end{background:#FF9500;}
    .slide-2022-intro{background:linear-gradient(135deg,#7C3AED,#EC4899);}.slide-2022-tracks{background:linear-gradient(135deg,#059669,#0891B2);}.slide-2022-artists{background:linear-gradient(135deg,#DC2626,#7C3AED);}.slide-2022-genre{background:linear-gradient(135deg,#D97706,#DC2626);}.slide-2022-minutes{background:linear-gradient(135deg,#0891B2,#7C3AED);}.slide-2022-end{background:linear-gradient(135deg,#059669,#7C3AED);}
    .slide-2021-intro{background:#000000;}.slide-2021-tracks{background:#121212;}.slide-2021-artists{background:#000000;}.slide-2021-genre{background:#1DB954;}.slide-2021-minutes{background:#121212;}.slide-2021-end{background:#000000;}

    .story-slide.generic { display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px 40px;text-align:center; }
    .slide-year-badge{font-size:11px;font-weight:700;letter-spacing:3px;opacity:0.6;margin-bottom:16px;text-transform:uppercase;}
    .slide-headline{font-size:clamp(14px,3.5vw,18px);font-weight:300;line-height:1.5;margin-bottom:8px;opacity:0.8;}
    .slide-big{font-size:clamp(36px,9vw,56px);font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:12px;}
    .slide-sub{font-size:clamp(13px,3vw,15px);font-weight:300;opacity:0.7;line-height:1.4;}
    .slide-number{font-size:clamp(64px,18vw,120px);font-weight:900;letter-spacing:-6px;line-height:0.9;margin-bottom:8px;}
    .slide-track-list{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:8px;}
    .slide-track-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.1);border-radius:12px;padding:10px 12px;}
    .slide-track-num{font-family:var(--font-mono);font-size:12px;font-weight:700;opacity:0.5;min-width:20px;}
    .slide-track-img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.1);}
    .slide-track-info{flex:1;min-width:0;}
    .slide-track-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .slide-track-artist{font-size:11px;opacity:0.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .slide-artist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;margin-top:8px;}
    .slide-artist-item{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,0.1);border-radius:14px;padding:14px 10px;}
    .slide-artist-img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,0.1);}
    .slide-artist-name{font-size:12px;font-weight:700;text-align:center;line-height:1.2;}
    .slide-artist-num{font-size:10px;opacity:0.5;font-family:var(--font-mono);}
    .slide-genre-pill{display:inline-block;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4);font-size:clamp(18px,5vw,28px);font-weight:900;padding:12px 28px;border-radius:100px;margin-bottom:16px;letter-spacing:-0.5px;}
    .slide-img-big{width:140px;height:140px;border-radius:20px;object-fit:cover;margin-bottom:16px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
    .slide-img-big.circle{border-radius:50%;}
    .monogram{position:absolute;font-size:200px;font-weight:900;opacity:0.06;letter-spacing:-20px;pointer-events:none;line-height:1;}
    .slide-swipe-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;opacity:0.35;letter-spacing:1px;white-space:nowrap;}

    /* Scroll divider */
    .scroll-divider{max-width:1200px;margin:48px auto 0;padding:0 24px;display:flex;align-items:center;gap:16px;}
    .scroll-divider-line{flex:1;height:1px;background:var(--border);}
    .scroll-divider-text{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;white-space:nowrap;}
    .scroll-arrow{text-align:center;padding:8px 0 32px;font-size:24px;animation:bounce 2s ease-in-out infinite;}
    @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}

    /* DASHBOARD */
    .dashboard{max-width:1200px;margin:0 auto;padding:40px 24px 100px;animation:fadeIn 0.6s ease both;}
    .dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px;flex-wrap:wrap;gap:16px;}
    .dash-brand{display:flex;align-items:center;gap:12px;}
    .dash-brand-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green);}
    .dash-brand-name{font-size:18px;font-weight:900;}
    .dash-brand-name span{color:var(--green);}
    .user-pill{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);padding:8px 16px 8px 8px;border-radius:100px;}
    .user-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface3);}
    .user-name{font-size:13px;font-weight:600;}
    .btn-logout{background:none;border:1px solid var(--border);color:var(--text-muted);font-family:var(--font-display);font-size:12px;padding:8px 16px;border-radius:100px;cursor:pointer;transition:all 0.2s;}

function inferGenres(artists) {
  const g={};
  artists.forEach(a=>{
    const name=a.name.toLowerCase();
    if(ARTIST_GENRE_MAP[name]){ARTIST_GENRE_MAP[name].forEach(x=>{g[x]=(g[x]||0)+2;});return;}
    for(const [key,genres] of Object.entries(ARTIST_GENRE_MAP)){
      if(name.includes(key)||key.includes(name)){genres.forEach(x=>{g[x]=(g[x]||0)+1;});break;}
    }
  });
  return Object.entries(g).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}

function generateCodeVerifier(l=128){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';let r='';crypto.getRandomValues(new Uint8Array(l)).forEach(v=>{r+=c[v%c.length];});return r;}
async function generateCodeChallenge(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
async function initiateLogin(){const v=generateCodeVerifier();localStorage.setItem('pkce_verifier',v);const p=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,code_challenge_method:'S256',code_challenge:await generateCodeChallenge(v),scope:SCOPES,show_dialog:'true'});window.location.href=`https://accounts.spotify.com/authorize?${p}`;}
async function exchangeToken(code){const v=localStorage.getItem('pkce_verifier');if(!v)throw new Error('No PKCE verifier');const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:v})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.error||'Token failed');localStorage.removeItem('pkce_verifier');return d;}

async function fetchAllData(token,timeRange){
  setDebug('Fetching '+timeRange+'...');
  const h={Authorization:`Bearer ${token}`};
  const get=async(url)=>{try{const r=await fetch(url,{headers:h});if(!r.ok)return null;return await r.json();}catch(e){return null;}};
  const [tracksData,artistsData,profileData,recentData]=await Promise.all([
    get(`https://api.spotify.com/v1/me/top/tracks?limit=50&time_range=${timeRange}`),
    get(`https://api.spotify.com/v1/me/top/artists?limit=50&time_range=${timeRange}`),
    get('https://api.spotify.com/v1/me'),
    get('https://api.spotify.com/v1/me/player/recently-played?limit=50'),
  ]);
  const tracks=tracksData?.items||[];
  const artists=artistsData?.items||[];
  const recentTracks=(recentData?.items||[]).map(i=>({...i.track,played_at:i.played_at}));
  const spotifyGenreMap={};
  artists.forEach(a=>(a.genres||[]).forEach(g=>{spotifyGenreMap[g]=(spotifyGenreMap[g]||0)+1;}));
  const spotifyGenres=Object.entries(spotifyGenreMap).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  const genres=spotifyGenres.length>0?spotifyGenres:inferGenres(artists);
  const albumMap={};
  tracks.forEach(t=>{const a=t.album;if(!a?.id)return;if(!albumMap[a.id])albumMap[a.id]={...a,trackCount:0};albumMap[a.id].trackCount++;});
  const albums=Object.values(albumMap).sort((a,b)=>b.trackCount-a.trackCount);
  const estMinutes=Math.round(tracks.reduce((s,t)=>(s+(t.duration_ms||180000)),0)/60000)*8;
  setDebug(`${tracks.length} tracks · ${artists.length} artists · ${genres.length} genres`);
  return{tracks,artists,albums,recentTracks,genres,profile:profileData||{},estMinutes};
}

function getDecadeBreakdown(tracks){const d={};tracks.forEach(t=>{const y=parseInt((t.album?.release_date||'2000').slice(0,4));const dec=Math.floor(y/10)*10;d[dec]=(d[dec]||0)+1;});const s=Object.entries(d).sort((a,b)=>b[1]-a[1]).slice(0,4);const max=s[0]?.[1]||1;return s.map(([dec,c])=>({decade:dec+'s',count:c,pct:Math.round((c/max)*100)}));}
function timeAgo(ds){const diff=Date.now()-new Date(ds).getTime(),m=Math.floor(diff/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}

// ── STORY VIEWER ──
function StoryViewer({ data }) {
  const YEARS=[2025,2024,2023,2022,2021];
  const [activeYear,setActiveYear]=useState(2025);
  const [slideIndex,setSlideIndex]=useState(0);
  const [progress,setProgress]=useState(0);
  const timerRef=useRef(null);
  const DURATION=5000;

  const slides=activeYear===2025?build2025Slides(data):buildOtherSlides(activeYear,data);
  const total=slides.length;

  const goNext=()=>setSlideIndex(i=>Math.min(i+1,total-1));
  const goPrev=()=>setSlideIndex(i=>Math.max(i-1,0));

  useEffect(()=>{
    setProgress(0);clearInterval(timerRef.current);
    const start=Date.now();
    timerRef.current=setInterval(()=>{
      const pct=Math.min(((Date.now()-start)/DURATION)*100,100);
      setProgress(pct);
      if(pct>=100){clearInterval(timerRef.current);setSlideIndex(i=>i<total-1?i+1:i);}
    },50);
    return()=>clearInterval(timerRef.current);
  },[slideIndex,activeYear]);

  const handleYearChange=(year)=>{setActiveYear(year);setSlideIndex(0);setProgress(0);};

  const progFill=activeYear===2025?'#000':'#fff';

  return (
    <div className="story-section">
      <div className="year-tabs">
        {YEARS.map(y=>(
          <button key={y} data-year={y} className={`year-tab ${activeYear===y?'active':''}`} onClick={()=>handleYearChange(y)}>
            {y} Wrapped
          </button>
        ))}
      </div>
      <div className="story-viewer" onClick={e=>{const r=e.currentTarget.getBoundingClientRect();e.clientX-r.left<r.width/2?goPrev():goNext();}}>
        <div className="story-progress">
          {slides.map((_,i)=>(
            <div className="story-progress-bar" key={i} style={{background:activeYear===2025?'rgba(0,0,0,0.15)':'rgba(255,255,255,0.25)'}}>
              <div className="story-progress-fill" style={{background:progFill,width:i<slideIndex?'100%':i===slideIndex?`${progress}%`:'0%'}}/>
            </div>
          ))}
        </div>
        {/* Render current slide */}
        {slides[slideIndex] && (
          <div key={slideIndex} style={{position:'absolute',inset:0,animation:'slideUp 0.3s ease both'}}>
            {slides[slideIndex].render()}
          </div>
        )}
        <div style={{position:'absolute',inset:0,display:'flex',zIndex:20,pointerEvents:'none'}}>
          <div style={{flex:1,pointerEvents:'auto'}} onClick={e=>{e.stopPropagation();goPrev();}}/>
          <div style={{flex:1,pointerEvents:'auto'}} onClick={e=>{e.stopPropagation();goNext();}}/>
        </div>
      </div>
      <div style={{textAlign:'center',marginTop:10,fontSize:12,color:'var(--text-dim)'}}>
        {slideIndex+1} / {total} — tap left/right to navigate
      </div>
    </div>
  );
}

        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          {profile.display_name&&<div className="user-pill"><img className="user-avatar" src={profile.images?.[0]?.url||''} alt={profile.display_name} onError={e=>{e.target.style.display='none';}}/><span className="user-name">{profile.display_name}</span></div>}
          <button className="btn-logout" onClick={onLogout}>Sign out</button>
        </div>
      </div>
      {error&&<div style={{maxWidth:1200,margin:'16px auto',padding:'0 24px'}}><div className="error-card">⚠️ {error} <button onClick={load} style={{background:'none',border:'none',color:'inherit',cursor:'pointer',textDecoration:'underline',marginLeft:8}}>Retry</button></div></div>}
      {!error&&!hasData&&<div className="empty-state"><div className="emoji">🎵</div><h2>Not enough listening history</h2><p>Try All Time or listen to more music!</p></div>}
      {!error&&hasData&&<>
        <StoryViewer data={data}/>
        <div className="scroll-divider"><div className="scroll-divider-line"/><div className="scroll-divider-text">Your full stats below</div><div className="scroll-divider-line"/></div>
        <div style={{textAlign:'center',padding:'8px 0 32px',fontSize:24,animation:'bounce 2s ease-in-out infinite'}}>↓</div>
        <div className="dashboard" style={{paddingTop:0}}>
          <TimeSelector value={timeRange} onChange={setTimeRange}/>
          <div className="hero-section">
            <div className="hero-card"><div className="hero-label">🎵 Top Track</div>{tracks[0]&&<><img className="hero-img" src={tracks[0].album?.images?.[0]?.url||''} alt={tracks[0].name} onError={e=>{e.target.src='https://via.placeholder.com/72/222/555?text=♪';}}/><div className="hero-value">{tracks[0].name}</div><div className="hero-meta">{(tracks[0].artists||[]).map(a=>a.name).join(', ')}</div></>}</div>
            <div className="hero-card"><div className="hero-label">🎤 Top Artist</div>{artists[0]&&<><img className="hero-img circle" src={artists[0].images?.[0]?.url||''} alt={artists[0].name} onError={e=>{e.target.src='https://via.placeholder.com/72/222/555?text=♪';}}/><div className="hero-value">{artists[0].name}</div><div className="hero-meta">{genres[0]||'Artist'}</div></>}</div>
            <div className="hero-card"><div className="hero-label">💿 Top Album</div>{albums[0]&&<><img className="hero-img" src={albums[0].images?.[0]?.url||''} alt={albums[0].name} onError={e=>{e.target.src='https://via.placeholder.com/72/222/555?text=♪';}}/><div className="hero-value">{albums[0].name}</div><div className="hero-meta">{(albums[0].artists||[]).map(a=>a.name).join(', ')}</div></>}</div>
          </div>
          <div className="stats-row">
            <div className="stat-block"><span className="stat-icon">🎵</span><div className="stat-number">{tracks.length}</div><div className="stat-label">Top tracks</div></div>
            <div className="stat-block"><span className="stat-icon">🎤</span><div className="stat-number">{artists.length}</div><div className="stat-label">Top artists</div></div>
            <div className="stat-block"><span className="stat-icon">⏱</span><div className="stat-number">{fmtNum(data.estMinutes)}</div><div className="stat-label">Est. minutes</div></div>
          </div>
          <VibeBanner tracks={tracks} genres={genres}/>
          <ShowMoreSection title="Top Tracks" items={tracks} initialCount={5} step={5} containerClass="track-list" renderItem={(t,i)=><TrackRow key={t.id} track={t} index={i} showTime={false}/>}/>
          <ShowMoreSection title="Top Artists" items={artists} initialCount={5} step={5} containerClass="artists-grid" renderItem={(a,i)=><ArtistCard key={a.id} artist={a} index={i}/>}/>
          <ShowMoreSection title="Top Albums" items={albums} initialCount={5} step={5} containerClass="albums-flex" renderItem={(a,i)=><AlbumCard key={a.id} album={a} index={i}/>}/>
          {recent.length>0&&<ShowMoreSection title="Recently Played" items={recent} initialCount={5} step={5} containerClass="track-list" renderItem={(t,i)=><TrackRow key={t.id+'-'+i} track={t} index={i} showTime={true}/>}/>}
          <div className="share-section">
            <div className="share-text"><h3>Share your Wrapped</h3><p>Let the world know what you've been listening to</p></div>
            <div className="share-buttons">
              <button className="btn-share twitter" onClick={tweetShare}><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.741l7.73-8.835L1.254 2.25H8.08l4.264 5.633 5.9-5.633zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Tweet</button>
              <button className="btn-share copy" onClick={handleShare}>📋 Copy Stats</button>
            </div>
          </div>
        </div>
      </>}
      {showCopied&&<div className="copied-toast">✓ Copied to clipboard!</div>}
    </div>
  );
}

function LoadingScreen({message='Loading…'}){return <div className="loading-screen"><div className="loading-bars">{[1,2,3,4,5].map(i=><span key={i}/>)}</div><p className="loading-text">{message}</p></div>;}

function LoginScreen(){
  const sp="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z";
  return(
    <div className="login-screen">
      <div className="logo-mark"><svg viewBox="0 0 24 24"><path d={sp}/></svg></div>
      <h1 className="login-title">Forever<br/><span>Wrapped</span></h1>
      <p className="login-subtitle">Your Spotify Wrapped — every year's style, your current data.</p>
      <button className="btn-login" onClick={initiateLogin}><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d={sp}/></svg>Connect with Spotify</button>
      <div className="login-features">{['2025 Style','2024 Style','2023 Style','2022 Style','2021 Style'].map(f=>(<div className="feature-pill" key={f}><span className="dot"/>{f}</div>))}</div>
    </div>
  );
}

function App(){
  const [token,setToken]=useState(()=>sessionStorage.getItem('spotify_token'));
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    const code=p.get('code'),err=p.get('error');
    setDebug(code?'Got callback...':err?'Error: '+err:'Ready');
    if(err){setError('Login cancelled: '+err);window.history.replaceState({},'','/');return;}
    if(code){window.history.replaceState({},'','/');setLoading(true);exchangeToken(code).then(d=>{sessionStorage.setItem('spotify_token',d.access_token);setToken(d.access_token);}).catch(e=>{setDebug('Error: '+e.message);setError(e.message);}).finally(()=>setLoading(false));}
  },[]);
  return(
    <div id="app">
      <div className="bg-orbs"><div className="orb orb1"/><div className="orb orb2"/><div className="orb orb3"/></div>
      {loading&&<LoadingScreen message="Connecting to Spotify…"/>}
      {error&&!loading&&<div className="login-screen"><div className="error-card" style={{maxWidth:440}}>⚠️ {error}</div><button className="btn-login" style={{marginTop:24}} onClick={()=>{setError(null);localStorage.clear();}}>Try Again</button></div>}
      {!loading&&!error&&!token&&<LoginScreen/>}
      {!loading&&!error&&token&&<MainApp token={token} onLogout={()=>{sessionStorage.removeItem('spotify_token');setToken(null);}}/>}
      <div id="debug-bar" className="debug-bar">🎵 Ready</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
